    startLine: 60
  assemblies:
  - RSML
  namespace: OceanApocalypseStudios.RSML.Sources
  summary: >-
    Counts the amount of items until the next line separator in the buffer, relative to a given <code class="paramref">index</code>.

    Only line separators count - regular whitespace do not. CRLF counts as a single line separator, to avoid double counting.
  example: []
  syntax:
    content: Result<int> CountUntilEndOfLine(int index, out bool isCrLf)
    parameters:
    - id: index
      type: System.Int32
      description: The index at which to start counting.
    - id: isCrLf
      type: System.Boolean
      description: Whether the line separator at which the method stopped is the CR in a CRLF sequence. If true, the next item in the buffer is LF.
    return:
      type: OceanApocalypseStudios.RSML.Diagnostics.Result{System.Int32}
      description: The index of the next line separator, relative to an <code class="paramref">index</code>.
    content.vb: Function CountUntilEndOfLine(index As Integer, isCrLf As Boolean) As Result(Of Integer)
  overload: OceanApocalypseStudios.RSML.Sources.IBuffer.CountUntilEndOfLine*
  nameWithType.vb: IBuffer.CountUntilEndOfLine(Integer, Boolean)
  fullName.vb: OceanApocalypseStudios.RSML.Sources.IBuffer.CountUntilEndOfLine(Integer, Boolean)
  name.vb: CountUntilEndOfLine(Integer, Boolean)
