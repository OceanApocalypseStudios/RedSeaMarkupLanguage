    startLine: 93
  assemblies:
  - RSML
  namespace: OceanApocalypseStudios.RSML.Sources
  summary: >-
    Counts the amount of items, starting from a given <code class="paramref">index</code>,

    while a <code class="paramref">predicate</code> returns <code>true</code>.
  example: []
  syntax:
    content: Result<int> CountWhile(Func<int, char, bool> predicate, int index)
    parameters:
    - id: predicate
      type: System.Func{System.Int32,System.Char,System.Boolean}
      description: >-
        A function that takes the current index (relative to <code class="paramref">index</code>),

        which is incremented every item, and the item associated with it. Execution stops when

        the predicate returns <code>false</code> or the index is out of bounds.
    - id: index
      type: System.Int32
      description: >-
        The index at which to start counting; all indexes will also be given to the

        <code class="paramref">predicate</code> as an offset that when added to the index of the position

        equal the actual index.
    return:
      type: OceanApocalypseStudios.RSML.Diagnostics.Result{System.Int32}
      description: The amount of items counted.
    content.vb: Function CountWhile(predicate As Func(Of Integer, Char, Boolean), index As Integer) As Result(Of Integer)
  overload: OceanApocalypseStudios.RSML.Sources.IBuffer.CountWhile*
