    path: ../src/RSML/ToolchainConfiguration.cs
    startLine: 52
  assemblies:
  - RSML
  namespace: OceanApocalypseStudios.RSML
  summary: Ignores all errors thrown during pipeline creation and pipeline execution.
  remarks: >-
    > [!CAUTION]

    > This option is only needed in beyond extremely rare occasions.

    > It emulates RSML v1.x.x behavior.
  example: []
  syntax:
    content: IgnoreAllExtensibilityErrors = IgnoreBrokenExtensions | IgnoreDuplicatedExtensions
    return:
      type: OceanApocalypseStudios.RSML.ToolchainConfiguration
    content.vb: IgnoreAllExtensibilityErrors = IgnoreBrokenExtensions Or IgnoreDuplicatedExtensions
