  type: Field
  source:
    remote:
      path: src/RSML/ToolchainConfiguration.cs
      branch: dev
      repo: https://github.com/OceanApocalypseStudios/RedSeaMarkupLanguage.git
    id: AllowOnlyOASExtensions
    path: ../src/RSML/ToolchainConfiguration.cs
    startLine: 32
  assemblies:
  - RSML
  namespace: OceanApocalypseStudios.RSML
  summary: Only allows OceanApocalypseStudios extensions, leading to an error if any non-OAS extension is active.
  remarks: >-
    > [!NOTE]

    > When used alongside <xref href="OceanApocalypseStudios.RSML.ToolchainConfiguration.IgnoreAllExtensibilityErrors" data-throw-if-not-resolved="false"></xref>, the non-OAS extensions will be disabled, but

    > no errors will be thrown.
  example: []
  syntax:
    content: AllowOnlyOASExtensions = 2
    return:
      type: OceanApocalypseStudios.RSML.ToolchainConfiguration
