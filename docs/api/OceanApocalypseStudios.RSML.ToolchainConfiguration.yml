- uid: OceanApocalypseStudios.RSML.ToolchainConfiguration.DisableExtensionProcessing
  commentId: F:OceanApocalypseStudios.RSML.ToolchainConfiguration.DisableExtensionProcessing
  id: DisableExtensionProcessing
  parent: OceanApocalypseStudios.RSML.ToolchainConfiguration
  langs:
  - csharp
  - vb
  name: DisableExtensionProcessing
  nameWithType: ToolchainConfiguration.DisableExtensionProcessing
  fullName: OceanApocalypseStudios.RSML.ToolchainConfiguration.DisableExtensionProcessing
  type: Field
  source:
    remote:
      path: src/RSML/ToolchainConfiguration.cs
      branch: dev
      repo: https://github.com/OceanApocalypseStudios/RedSeaMarkupLanguage.git
    id: DisableExtensionProcessing
    path: ../src/RSML/ToolchainConfiguration.cs
    startLine: 22
  assemblies:
  - RSML
  namespace: OceanApocalypseStudios.RSML
  summary: Optimizes the toolchain pipeline by disabling extension processing.
  remarks: >-
    > [!WARNING]

    > This completely disables extensions, but does not warn you if there are active extensions,

    > meaning sometimes you might be wondering why your extension is not working when, in reality,

    you've enabled this configuration.

    > [!TIP]

    > This configuration is automatically enabled when no extensions are enabled.
  example: []
  syntax:
    content: DisableExtensionProcessing = 1
    return:
      type: OceanApocalypseStudios.RSML.ToolchainConfiguration
- uid: OceanApocalypseStudios.RSML.ToolchainConfiguration.AllowOnlyOASExtensions
