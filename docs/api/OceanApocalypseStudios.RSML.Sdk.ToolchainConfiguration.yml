- uid: OceanApocalypseStudios.RSML.Sdk.ToolchainConfiguration.DisableExtensionProcessing
  commentId: F:OceanApocalypseStudios.RSML.Sdk.ToolchainConfiguration.DisableExtensionProcessing
  id: DisableExtensionProcessing
  parent: OceanApocalypseStudios.RSML.Sdk.ToolchainConfiguration
  langs:
  - csharp
  - vb
  name: DisableExtensionProcessing
  nameWithType: ToolchainConfiguration.DisableExtensionProcessing
  fullName: OceanApocalypseStudios.RSML.Sdk.ToolchainConfiguration.DisableExtensionProcessing
  type: Field
  source:
    remote:
      path: src/RSML/Sdk/ToolchainConfiguration.cs
      branch: docs
      repo: https://github.com/OceanApocalypseStudios/RedSeaMarkupLanguage.git
    id: DisableExtensionProcessing
    path: ../src/RSML/Sdk/ToolchainConfiguration.cs
    startLine: 21
  assemblies:
  - RSML
  namespace: OceanApocalypseStudios.RSML.Sdk
  summary: Optimizes the toolchain pipeline by disabling extension processing.
  remarks: >-
    > [!WARNING]

    > This completely disables extensions, but does not warn you if there are active extensions,

    > meaning sometimes you might be wondering why your extension is not working when, in reality,

    you've enabled this configuration.

    > [!IMPORTANT]

    > This configuration is automatically enabled when no extensions are enabled, meaning that

    > if you pass this configuration manually when no extensions are active, you will cause RSML

    > to error out due to duplicated configuration, unless <xref href="OceanApocalypseStudios.RSML.Sdk.ToolchainConfiguration.SilentlyIgnoreDuplicatedConfigurations" data-throw-if-not-resolved="false"></xref>

    > or <xref href="OceanApocalypseStudios.RSML.Sdk.ToolchainConfiguration.SilentlyIgnoreAllErrors" data-throw-if-not-resolved="false"></xref> are enabled.
  example: []
  syntax:
    content: DisableExtensionProcessing = 0
    return:
      type: OceanApocalypseStudios.RSML.Sdk.ToolchainConfiguration
- uid: OceanApocalypseStudios.RSML.Sdk.ToolchainConfiguration.AllowOnlyOASExtensions
  commentId: F:OceanApocalypseStudios.RSML.Sdk.ToolchainConfiguration.AllowOnlyOASExtensions
