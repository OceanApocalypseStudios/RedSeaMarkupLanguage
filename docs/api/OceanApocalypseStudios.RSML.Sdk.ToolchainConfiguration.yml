  source:
    remote:
      path: src/RSML/Sdk/ToolchainConfiguration.cs
      branch: docs
      repo: https://github.com/OceanApocalypseStudios/RedSeaMarkupLanguage.git
    id: AllowOnlyOASExtensions
    path: ../src/RSML/Sdk/ToolchainConfiguration.cs
    startLine: 31
  assemblies:
  - RSML
  namespace: OceanApocalypseStudios.RSML.Sdk
  summary: Only allows OceanApocalypseStudios extensions, leading to an error if any non-OAS extension is active.
  remarks: >-
    > [!NOTE]

    > When used alongside <xref href="OceanApocalypseStudios.RSML.Sdk.ToolchainConfiguration.SilentlyIgnoreAllErrors" data-throw-if-not-resolved="false"></xref>, the non-OAS extensions will be disabled, but

    > no errors will be thrown.
  example: []
  syntax:
    content: AllowOnlyOASExtensions = 1
    return:
      type: OceanApocalypseStudios.RSML.Sdk.ToolchainConfiguration
