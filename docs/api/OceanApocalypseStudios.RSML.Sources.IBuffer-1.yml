  name: TryGetWord(int, Func<int, TItem, bool>, Span<TItem>, out bool, out int)
  nameWithType: IBuffer<TItem>.TryGetWord(int, Func<int, TItem, bool>, Span<TItem>, out bool, out int)
  fullName: OceanApocalypseStudios.RSML.Sources.IBuffer<TItem>.TryGetWord(int, System.Func<int, TItem, bool>, System.Span<TItem>, out bool, out int)
  type: Method
  source:
    remote:
      path: src/RSML/Sources/IBuffer.cs
