    path: ../src/RSML/Sources/IBuffer.cs
    startLine: 51
  assemblies:
  - RSML
  namespace: OceanApocalypseStudios.RSML.Sources
  summary: >-
    Counts the amount of items until the next line separator in the buffer, relative to a given <code class="paramref">index</code>.

    Only line separators count - regular whitespace do not. CRLF counts as a single line separator, to avoid double counting.
  example: []
  syntax:
    content: int CountUntilLineSeparator(int index, out bool isCrLf)
    parameters:
    - id: index
      type: System.Int32
      description: The index at which to start counting.
    - id: isCrLf
      type: System.Boolean
      description: Whether the line separator at which the method stopped is the CR in a CRLF sequence. If true, the next item in the buffer is LF.
    return:
      type: System.Int32
      description: The index of the next line separator, relative to an <code class="paramref">index</code>.
    content.vb: Function CountUntilLineSeparator(index As Integer, isCrLf As Boolean) As Integer
  overload: OceanApocalypseStudios.RSML.Sources.IBuffer`1.CountUntilLineSeparator*
  nameWithType.vb: IBuffer(Of TItem).CountUntilLineSeparator(Integer, Boolean)
  fullName.vb: OceanApocalypseStudios.RSML.Sources.IBuffer(Of TItem).CountUntilLineSeparator(Integer, Boolean)
  name.vb: CountUntilLineSeparator(Integer, Boolean)
