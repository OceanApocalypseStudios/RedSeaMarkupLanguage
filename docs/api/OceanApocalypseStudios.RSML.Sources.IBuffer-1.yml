    id: TryGetWord
    path: ../src/RSML/Sources/IBuffer.cs
    startLine: 256
  assemblies:
  - RSML
  namespace: OceanApocalypseStudios.RSML.Sources
  summary: >-
    Tries to read the word at index <code class="paramref">index</code>, which can be a span of items verified by

    <code class="paramref">itemKindPredicate</code> (if the starting index is verified by <code class="paramref">itemKindPredicate</code>)

    or a span of content not verified by <code class="paramref">itemKindPredicate</code> (if

    the starting index does not point to anything verified by <code class="paramref">itemKindPredicate</code>).
  remarks: >-
    This method may lead to partial reading (for example if <code class="paramref">destination</code> is not

    large enough). When this happens, the return value will be <strong>False</strong> but <code class="paramref">itemCount</code>

    will be set to something greater than <code>0</code>.
  example: []
  syntax:
    content: bool TryGetWord(int index, Func<int, TItem, bool> itemKindPredicate, Span<TItem> destination, out bool isItemKind, out int itemCount)
    parameters:
    - id: index
      type: System.Int32
      description: The index at which the word starts.
    - id: itemKindPredicate
      type: System.Func{System.Int32,{TItem},System.Boolean}
      description: >-
        A predicate that verifies if the first item in the selected range serves as the delimiter

        (the predicate returns <code>true</code> if so). For example, if the predicate verifies <code>,</code>, then 

        the current word if the buffer is <code>My awesome buffer, isn't it cool?</code> starting from <code class="paramref">index</code>,

        is <code>My awesome buffer</code>. If the predicate verifies <code>;</code>, then the current word

        if the buffer is <code>;;so very awesome</code> starting from <code class="paramref">index</code>, is <code>;;</code>.
    - id: destination
      type: System.Span{{TItem}}
      description: The span which will be the destination for the read content.
    - id: isItemKind
      type: System.Boolean
      description: >-
        True if the span is fully comprised of the item kind verified by <code class="paramref">itemKindPredicate</code>.

        If False, no items verified by <code class="paramref">itemKindPredicate</code> is present.
    - id: itemCount
      type: System.Int32
      description: The amount of characters that were written to <code class="paramref">destination</code>.
    return:
      type: System.Boolean
      description: False if the buffer is out of bounds, the reading was only partial or an exception occured.
    content.vb: Function TryGetWord(index As Integer, itemKindPredicate As Func(Of Integer, TItem, Boolean), destination As Span(Of TItem), isItemKind As Boolean, itemCount As Integer) As Boolean
