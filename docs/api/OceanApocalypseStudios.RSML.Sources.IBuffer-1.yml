  assemblies:
  - RSML
  namespace: OceanApocalypseStudios.RSML.Sources
  summary: >-
    Tries to read the word at index <code class="paramref">index</code>, which can be a span of items verified by

    <code class="paramref">itemKindPredicate</code> (if the starting index is verified by <code class="paramref">itemKindPredicate</code>)

    or a span of content not verified by <code class="paramref">itemKindPredicate</code> (if

    the starting index does not point to anything verified by <code class="paramref">itemKindPredicate</code>).
  example: []
  syntax:
    content: TItem[] GetWord(int index, Func<int, TItem, bool> itemKindPredicate, out bool isItemKind)
    parameters:
    - id: index
      type: System.Int32
      description: The index at which the word starts.
    - id: itemKindPredicate
      type: System.Func{System.Int32,{TItem},System.Boolean}
      description: >-
        A predicate that verifies if the first item in the selected range serves as the delimiter

        (the predicate returns <code>true</code> if so). For example, if the predicate verifies <code>,</code>, then 

        the current word if the buffer is <code>My awesome buffer, isn't it cool?</code> starting from <code class="paramref">index</code>,

        is <code>My awesome buffer</code>. If the predicate verifies <code>;</code>, then the current word

        if the buffer is <code>;;so very awesome</code> starting from <code class="paramref">index</code>, is <code>;;</code>.
    - id: isItemKind
      type: System.Boolean
      description: >-
        True if the array is fully comprised of the item kind verified by <code class="paramref">itemKindPredicate</code>.

        If False, no items verified by <code class="paramref">itemKindPredicate</code> is present.
    return:
      type: '{TItem}[]'
      description: The line, as an array of items.
    content.vb: Function GetWord(index As Integer, itemKindPredicate As Func(Of Integer, TItem, Boolean), isItemKind As Boolean) As TItem()
