      type: System.Int32
      description: The index at which the word starts.
    - id: itemKind
      type: System.Char
      description: >-
        The item that will serve as the delimiter. For example, if item kind is <code>,</code>, then 

        the current word if the buffer is <code> My awesome buffer, isn't it cool?</code> starting from <code class="paramref">index</code>,

        is <code> My awesome buffer</code>. If item kind is <code>;</code>, then 

        the current word if the buffer is <code>;;so very awesome</code> starting from <code class="paramref">index</code>, is <code>;;</code>.
    - id: isItemKind
      type: System.Boolean
      description: >-
        True if the array is fully comprised of <code class="paramref">itemKind</code>.

