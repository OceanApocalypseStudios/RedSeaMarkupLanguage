    content.vb: Public Class ReadOnlyStringBuffer Implements IBuffer, ISource, IDisposable, IEquatable(Of IBuffer), IEquatable(Of Char()), IEquatable(Of ReadOnlyMemory(Of Char)), ISupportsCache, IEquatable(Of String)
