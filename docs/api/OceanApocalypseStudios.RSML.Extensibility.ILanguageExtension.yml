  - RSML.Extensibility
  namespace: OceanApocalypseStudios.RSML.Extensibility
  summary: A required <xref href="System.String" data-throw-if-not-resolved="false"></xref> with the name of the extension.
  remarks: >-
    If your extension has a name that is common, it's best to use a recognizable pattern

    such as <code>domain.organization.product</code> or <code>domain.name.product</code> or even <code>name.product.id</code>.

    > [!WARNING]

    > The string must <strong>not</strong> contain any characters that are not allowed in the language.
  example: []
