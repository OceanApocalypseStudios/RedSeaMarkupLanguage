name: Run tests

on:
  push:
    branches:
      - main
      - dev
    paths:
      - "src/**"
      - "benchmarks/**"
      - "tests/**"
      - "**/*.csproj"
      - "**/*.slnx"
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "src/**"
      - "benchmarks/**"
      - "tests/**"
      - "**/*.csproj"
      - "**/*.slnx"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --framework net10.0 --configuration Release --no-build
